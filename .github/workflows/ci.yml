name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore MicroservicesDDD.sln
      - name: Build
        run: dotnet build MicroservicesDDD.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/Tests/Tests.csproj -c Release --no-build
