name: Docker

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity
            file: src/Services/Identity/Identity.WebApi/Dockerfile
            context: .
          - name: product
            file: src/Services/Product/Product.WebApi/Dockerfile
            context: .
          - name: customer
            file: src/Services/Customer/Customer.WebApi/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v5

      - name: docker build
        # No push: the job exists to prove the image still builds.
        run: docker build --file "${{ matrix.file }}" --tag "ci-image-${{ matrix.name }}:latest" "${{ matrix.context }}"
